{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}{{ fail "httpRoute.parentRefs is required when httpRoute.enabled=true (the Gateway to attach to)" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pd.fullname" . }}
  labels: {{- include "pd.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches: {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts: {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "pd.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
